version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    codeql-action:
      patterns:
        - "github/codeql-action*"

- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
    semver-major-days: 14
  groups:
    cargo:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
